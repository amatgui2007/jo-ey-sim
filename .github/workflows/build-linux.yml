name: build-linux

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential make git curl \
            qtbase5-dev qttools5-dev-tools \
            libsqlite3-dev lua5.3 liblua5.3-dev \
            libgit2-dev libcurl4-openssl-dev libfreetype-dev libfmt-dev \
            libssl-dev libevent-dev \
            libx11-dev libxxf86vm-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxinerama-dev libgl1-mesa-dev libglu1-mesa-dev \
            meson ninja-build

      - name: Install premake5
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -L https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-linux.tar.gz \
            | tar -xz -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/premake5"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download Irrlicht
        run: |
          mkdir -p .deps/irrlicht
          git clone --depth 1 https://github.com/edo9300/irrlicht.git .deps/irrlicht.tmp
          mv .deps/irrlicht.tmp/include .deps/irrlicht/include
          mv .deps/irrlicht.tmp/source .deps/irrlicht/src
          rm -rf .deps/irrlicht.tmp

      - name: Build Irrlicht
        run: |
          cd .deps/irrlicht/src/Irrlicht
          make -j"$(nproc)"

      - name: Configure irrlicht include
        run: |
          sudo ln -sfn "$PWD/.deps/irrlicht/include" /usr/include/irrlicht

      - name: Build client
        run: |
          cd client
          premake5 gmake2
          cd build
          make config=release_x64 ygopro -j"$(nproc)"
        env:
          CPATH: /usr/include/freetype2
          LIBRARY_PATH: ${{ github.workspace }}/.deps/irrlicht/lib/Linux

      - name: Verify binary
        run: |
          ls -lh client/bin/x64/release/ygopro
