name: sync-data
on:
schedule:
* cron: "0 3 * * *"
workflow_dispatch:
jobs:
check-and-sync:
runs-on: ubuntu-latest
steps:
* uses: actions/checkout@v4
* uses: actions/setup-python@v5
with:
python-version: "3.11"
* name: Install deps
run: pip install -r tools/ygoprodeck_sync/requirements.txt
* name: Check DB version
run: python tools/ygoprodeck_sync/sync.py --check
* name: Full sync (manual only)
if: github.event_name == 'workflow_dispatch'
run: python tools/ygoprodeck_sync/sync.py --full
* name: Upload artifacts
if: github.event_name == 'workflow_dispatch'
uses: actions/upload-artifact@v4
with:
name: cardinfo-json
path: data/official/*.json
